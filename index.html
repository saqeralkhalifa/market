<script>
/* MCLANG: one language resolver shared across Dr. Saqer AlKhalifa's tools. */
function mcInitLang(){
  try{
    var q = (location.search.match(/[?&]lang=(ar|en)\b/) || [])[1];
    if(q) return q;
    var s = window.localStorage && localStorage.getItem("mc-lang");
    if(s === "ar" || s === "en") return s;
    var n = (navigator.languages && navigator.languages[0]) || navigator.language || "";
    if(/^ar/i.test(n)) return "ar";
  }catch(e){}
  return "en";
}
function mcSaveLang(v){ try{ localStorage.setItem("mc-lang", v); }catch(e){} }

<style>
/* ================= THEME 2a MAJLIS, BLUE BAND =================
   The same look as saqeralkhalifa.com: cream paper, one deep blue
   band, gold for emphasis, EB Garamond throughout. Radius 2px.

  --band:#152A55; --band-line:#2E4477; --royal:#1E3A78;
  --on-band:#F3EADA; --on-band-muted:#9AAAD0; --on-band-link:#D3DCEF;
  --gold:#C09A45; --gold-dark:#7D5F27;

  --navy:#152A55; --navy-deep:#1E3A78;
  --accent:#1E3A78; --accent-soft:#EFE4CE; --accent-line:#D3C0A0;
  --gold-soft:#EFE4CE; --gold-line:#E2D5BB; --gold-bright:#C09A45;
  --good:#3F6B4F; --good-soft:#EAEFE3; --good-line:#C9D6C2;
  --warn:#7D5F27; --warn-soft:#F5ECDA; --warn-line:#E2D5BB;
  --bad:#8C3A30; --bad-soft:#F4E7E1; --bad-line:#E2CBC1;
  --radius:2px; --radius-sm:2px; --shadow:none; --shadow-lift:none;

  --mc-paper:#FAF5EA; --mc-band:#EFE4CE; --mc-card:#FFFBF2;
  --mc-ink:#4A3728; --mc-ink-2:#6B5B47; --mc-ink-3:#6F5D4A; --mc-muted:#6F5D4A;
  --mc-rule:#E2D5BB; --mc-border:#D3C0A0;
  --mc-accent:#1E3A78; --mc-accent-dim:#C09A45;
  --mc-on-dark:#F3EADA; --mc-on-dark-2:#9AAAD0; --mc-dark-rule:#2E4477;
  --mc-serif:'EB Garamond', Georgia, serif;

  --deep:#152A55;          /* the one dark panel color is the band blue */
  --muted:#6F5D4A; --sec:#6B5B47; --body:#4A3728;
}

<script>
/* MCXL: cross-property links carry the current language, because localStorage does not cross origins. */
(function(){
  var HOSTS = ["gigs.saqeralkhalifa.com","market.saqeralkhalifa.com","internships.saqeralkhalifa.com","saqeralkhalifa.github.io"];
  function cur(){ return document.documentElement.lang === "ar" ? "ar" : "en"; }
  function fix(a){
    try{
      var u = new URL(a.getAttribute("href"), location.href);
      if(u.host === location.host || HOSTS.indexOf(u.host) < 0) return;
      u.searchParams.set("lang", cur()); a.href = u.href;
    }catch(e){}
  }
  function all(){ var n = document.querySelectorAll("a[href]"); for(var i=0;i<n.length;i++) fix(n[i]); }
  try{ new MutationObserver(all).observe(document.documentElement,{attributes:true,attributeFilter:["lang"]}); }catch(e){}
  document.addEventListener("click", function(e){ var a = e.target && e.target.closest && e.target.closest("a[href]"); if(a) fix(a); }, true);
  window.addEventListener("load", all); all();
})();
